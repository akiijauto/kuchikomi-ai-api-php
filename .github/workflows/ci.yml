name: CI

# このリポジトリは「クチコミ返信AI」のAPIを PHP で実装したもの。
# テーブル定義の正本はここには置かず、元リポジトリ（kuchikomi-ai-multi-stack）の
# web/supabase/schema.sql のままにしてある。同じ定義に複数言語の実装を載せるのが主旨で、
# 定義を複製すると「どちらが正なのか」が分からなくなるため（Go版・Rails版と同じ方針）。
#
# Go版・Rails版のCIと違い、このジョブではDBを起動してのスキーマ投入・コンテナ起動確認は
# 行わない（構文チェック・単体テスト・イメージのビルド確認まで）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: テスト（PHP ${{ matrix.php }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7

      - name: PHP ${{ matrix.php }} をセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, pdo, pdo_pgsql
          coverage: none

      - name: composer.json の妥当性
        run: composer validate --strict

      - name: 依存関係のインストール
        run: composer install --prefer-dist --no-progress

      - name: 構文チェック（src/ と public/ の全PHPファイル）
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find src public -type f -name '*.php' -print0)
          exit "$status"

      - name: PHPUnit
        run: vendor/bin/phpunit

  docker:
    name: Dockerイメージのビルド確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: イメージをビルド
        env:
          DOCKER_BUILD_SUMMARY: "false"
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kuchikomi-php:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: イメージサイズを記録
        run: docker image ls kuchikomi-php:ci
